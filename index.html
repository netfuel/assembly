<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e9eaec" />
    <meta name="description" content="Underground music, DIY shows, raves, and queer nights on one live map." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Assembly" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Assembly</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Assembly" />
    <meta property="og:title" content="Assembly" />
    <meta property="og:description" content="Underground music, DIY shows, raves, and queer nights on one live map." />
    <meta property="og:image" content="https://assembly.rsvp/icons/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Set the theme before first paint so there's no flash. Light unless the visitor chose dark.
      (function () {
        var t = "light";
        try { if (localStorage.getItem("assembly-theme") === "dark") t = "dark"; } catch (e) {}
        document.documentElement.dataset.theme = t;
        if (t === "dark") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0a0a0b");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
