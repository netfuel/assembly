    <script>
      // Self-heal a stale app shell: if the app's own script can't load (an old cached page pointing at files a
      // newer deploy removed), drop the service worker and its caches and reload once from the network.
      (function () {
        var healed = false;
        window.addEventListener("error", function (e) {
          var el = e.target;
          if (healed || !el || el.tagName !== "SCRIPT" || !/\/assets\//.test(el.src || "")) return;
          healed = true;
          try { if (sessionStorage.getItem("assembly-healed") === "1") return; sessionStorage.setItem("assembly-healed", "1"); } catch (x) {}
          var regs = navigator.serviceWorker ? navigator.serviceWorker.getRegistrations() : Promise.resolve([]);
          var keys = window.caches ? caches.keys() : Promise.resolve([]);
          Promise.all([regs, keys]).then(function (r) {
            return Promise.all(r[0].map(function (g) { return g.unregister(); }).concat(r[1].map(function (k) { return caches.delete(k); })));
          }).finally(function () { location.reload(); });
        }, true);
      })();
      // Set the theme before first paint so there's no flash. Dark unless the visitor chose light.
      // The choice lives under a new key since dark became the default; the old key is ignored and cleared.
      (function () {
        var t = "dark";
        try { localStorage.removeItem("assembly-theme"); if (localStorage.getItem("assembly-theme-choice") === "light") t = "light"; } catch (e) {}
        document.documentElement.dataset.theme = t;
        if (t === "light") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#e9eaec");
        // Shared links and policy pages go straight to their content: no splash.
        // And once per tab: an app update reloads the page right after the first open, and the splash shouldn't play twice.
        var seen = false;
        try { seen = sessionStorage.getItem("assembly-splash") === "1"; sessionStorage.setItem("assembly-splash", "1"); } catch (e) {}
        if (seen || /^\/(e|a|v|o|terms|privacy|guidelines)\//.test(location.pathname + "/") || /[?&]ref=/.test(location.search)) document.documentElement.dataset.splash = "skip";
      })();
    </script>
    <style>
      /*
        Cold-start splash (to-do: Preloader). Four beats, the first three in CSS so they start on the first paint:
        1. 0–0.8s   thin accent lines shoot in from the screen edges toward the A
        2. 0.5–1.5s they lock into the A: its outline draws, then the off-register echo prints
        3. 1.5–2.0s the A turns into a window onto the live app underneath
        4. ≥2.1s    src/lib/splash.ts zooms through the A's right stem once the events are in (and the map, up to 0.4s more)
                    (hard cap 6s, tap to skip), then a pin pulse marks the reveal
        The A is the logo's Timeless Serif outline (public/icons/favicon.svg), in a 512 box.
      */
      #splash { --sp-ground: #0a0a0b; --sp-fg: #ededee; --sp-accent: #ff3df2; --sp-uv: #a98bff;
        position: fixed; inset: 0; z-index: 100; overflow: hidden; cursor: pointer; -webkit-tap-highlight-color: transparent;
        animation: sp-failsafe 0.4s 9s forwards; }
      [data-theme="light"] #splash { --sp-ground: #e9eaec; --sp-fg: #121315; }
      [data-splash="skip"] #splash { display: none; }
      #splash svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
      #splash .sp-ground, #splash .sp-cover { fill: var(--sp-ground); }
      #splash .sp-cover { animation: sp-window 0.5s 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
      /* Strokes are in the 720-unit view box: about 1.5px on screen at each size (dashes need plain, scaling strokes). */
      #splash .sp-outline, #splash .sp-echo, #splash .sp-lines line { fill: none; stroke: var(--sp-accent); stroke-width: 1.25; stroke-linecap: square; }
      @media (max-width: 760px), (max-height: 760px) { #splash .sp-outline, #splash .sp-echo, #splash .sp-lines line { stroke-width: 1.8; } }
      @media (max-width: 480px) { #splash .sp-outline, #splash .sp-echo, #splash .sp-lines line { stroke-width: 2.6; } }
      #splash .sp-outline { stroke: var(--sp-fg); stroke-dasharray: 1 1; stroke-dashoffset: 1; animation: sp-draw 1s 0.5s cubic-bezier(0.65, 0, 0.35, 1) forwards; }
      #splash .sp-echo { opacity: 0; animation: sp-print 0.5s 1.35s steps(1) forwards; }
      #splash .sp-lines line { stroke-dasharray: 22 100; stroke-dashoffset: 22; animation: sp-shoot 0.75s cubic-bezier(0.55, 0, 0.2, 1) forwards; }
      #splash .sp-lines line:nth-child(2) { animation-delay: 0.06s; } #splash .sp-lines line:nth-child(3) { animation-delay: 0.12s; }
      #splash .sp-lines line:nth-child(4) { animation-delay: 0.18s; } #splash .sp-lines line:nth-child(5) { animation-delay: 0.24s; }
      #splash .sp-lines line:nth-child(6) { animation-delay: 0.3s; } #splash .sp-lines line:nth-child(7) { animation-delay: 0.36s; }
      #splash .sp-lines line:nth-child(8) { animation-delay: 0.42s; stroke: var(--sp-uv); }
      #splash .sp-zoom { transform: translate(294px, 250px) scale(1) translate(-294px, -250px);
        transition: transform 0.95s cubic-bezier(0.7, 0, 0.84, 0); }
      #splash .sp-caption { position: absolute; left: 0; right: 0; top: calc(50% + min(22.5vw, 22.5vh) + 26px); text-align: center;
        font: 500 10px/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: 0.24em; text-transform: uppercase; color: var(--sp-fg);
        opacity: 0; animation: sp-fade-in 0.6s 1.2s ease forwards; transition: opacity 0.25s; }
      #splash .sp-caption b { color: var(--sp-accent); font-weight: 500; }
      #splash .sp-ring { position: absolute; left: 50%; top: 50%; width: 36px; height: 36px; margin: -18px 0 0 -18px; border-radius: 50%;
        border: 1.5px solid var(--sp-accent); opacity: 0; pointer-events: none; }
      /* Beat 4, driven by splash.ts */
      #splash.is-reveal { cursor: default; pointer-events: none; }
      #splash.is-reveal .sp-zoom { transform: translate(294px, 250px) scale(70) translate(-294px, -250px); }
      #splash .sp-marks, #splash .sp-lines { transition: opacity 0.3s; }
      #splash.is-reveal .sp-marks, #splash.is-reveal .sp-lines { opacity: 0; }
      #splash.is-reveal .sp-caption { animation: none; opacity: 0; }
      #splash.is-reveal .sp-cover { animation: none; opacity: 0; }
      #splash.is-done svg { opacity: 0; transition: opacity 0.15s; }
      #splash.is-done .sp-ring { animation: sp-ring 0.7s cubic-bezier(0.2, 0.6, 0.3, 1) forwards; }
      @keyframes sp-shoot { 0% { stroke-dashoffset: 22; opacity: 1; } 85% { stroke-dashoffset: -78; opacity: 1; } 100% { stroke-dashoffset: -78; opacity: 0; } }
      @keyframes sp-draw { to { stroke-dashoffset: 0; } }
      @keyframes sp-print { 0% { opacity: 0.9; } 20% { opacity: 0; } 40%, 100% { opacity: 0.85; } }
      @keyframes sp-window { to { opacity: 0; } }
      @keyframes sp-fade-in { to { opacity: 0.7; } }
      @keyframes sp-ring { 0% { opacity: 0.9; transform: scale(0.4); } 100% { opacity: 0; transform: scale(9); } }
      @keyframes sp-failsafe { to { opacity: 0; visibility: hidden; } }
      /* Reduced motion: no flying lines or zoom; the logo appears, then fades out when the app is ready. */
      @media (prefers-reduced-motion: reduce) {
        #splash .sp-lines { display: none; }
        #splash .sp-outline { animation: none; stroke-dashoffset: 0; }
        #splash .sp-echo { animation: none; opacity: 0.85; }
        #splash .sp-cover, #splash .sp-caption { animation: none; }
        #splash .sp-caption { opacity: 0.7; }
        #splash .sp-zoom, #splash.is-reveal .sp-zoom { transition: none; transform: none; }
        #splash.is-reveal { opacity: 0; transition: opacity 0.3s; }
        #splash.is-done .sp-ring { animation: none; }
      }
    </style>
