# Regression suite on every push and pull request. Production deploys only from main, only when this passes.
#
# Deploying from here needs two repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   a token with "Edit Cloudflare Workers" (plus D1 edit for migrations)
#   CLOUDFLARE_ACCOUNT_ID  the account id from the Workers dashboard
# Then turn off automatic production deploys in Workers Builds, so this workflow is the only way to deploy.
# Until the secrets exist, the deploy job is skipped and the workflow only reports.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # Nightly, and on request: the full sweep at every width.
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

# A newer push replaces an older run on the same branch, except on main: a main run that may deploy is never
# cancelled (it would leave production on older code), and the nightly sweep runs in its own group so it can't
# cancel a deploy either. Main runs queue instead; GitHub keeps the newest waiting one.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'schedule' && 'nightly' || 'run' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build and bundle check
        run: npm run build && npm run check:bundle
      - name: Browser
        run: npx playwright install --with-deps chromium
      - name: Local settings for the test server
        # Test-only values: dev sign-in on localhost and a test moderator. Never used in production.
        run: printf 'DEV_LOGIN=1\nMODERATORS=test-moderator@dev.localhost\n' > .dev.vars
      - name: Regression suite (API, browser, cross-cutting)
        run: npm run test:e2e -- --project=phone
        env:
          E2E_FULL: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' && '1' || '' }}
      - name: Modules switched off
        run: npm run test:e2e:flags
      - name: Launch gate on
        run: npm run test:e2e:gate -- --project=phone
      - name: Demo site (guest sign-in, nightly reset, friends on the map)
        run: npm run test:e2e:demo
      - name: Built app (service worker, offline, headers)
        run: npm run test:e2e:built
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: e2e-results/
          retention-days: 14

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check for deploy credentials
        id: creds
        run: echo "ok=${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.creds.outputs.ok == 'true'
      - name: Check the Cloudflare token
        if: steps.creds.outputs.ok == 'true'
        run: |
          r=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify")
          echo "$r" | jq -c '{success, status: .result.status, errors: [.errors[]?.message]}'
          echo "$r" | jq -e '.success == true and .result.status == "active"' > /dev/null || { echo "::error::CLOUDFLARE_API_TOKEN isn't a valid, active account token. Roll it in Cloudflare and paste the new value into the GitHub secret."; exit 1; }
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply database migrations
        if: steps.creds.outputs.ok == 'true'
        run: npx wrangler d1 migrations apply assembly --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy
        if: steps.creds.outputs.ok == 'true'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Production smoke check (link previews on the live site)
        if: steps.creds.outputs.ok == 'true'
        run: sleep 20 && npm run test:smoke
      - name: Not deploying
        if: steps.creds.outputs.ok != 'true'
        run: 'echo "::notice::Tests passed. Deploy skipped, add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to deploy from CI."' 

  # demo.assembly.rsvp: the same build with DEMO=1, invented content, and its own database, sessions and bucket.
  # Runs after the tests, beside the production deploy, with the same two secrets. See worker/demo.ts.
  deploy-demo:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for deploy credentials
        id: creds
        run: echo "ok=${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.creds.outputs.ok == 'true'
      - name: Demo database, sessions and bucket
        if: steps.creds.outputs.ok == 'true'
        run: node scripts/demo-resources.mjs provision
      - name: Demo database migrations
        if: steps.creds.outputs.ok == 'true'
        run: npx wrangler d1 migrations apply assembly-demo --remote --env demo
      - name: Demo content (fresh dates on every deploy; the Worker also resets it nightly)
        if: steps.creds.outputs.ok == 'true'
        run: npx wrangler d1 execute assembly-demo --remote --env demo --file db/demo/seed.sql --yes
      - name: Build for the demo
        if: steps.creds.outputs.ok == 'true'
        run: npm run build
        env:
          CLOUDFLARE_ENV: demo
      - name: Deploy the demo Worker
        if: steps.creds.outputs.ok == 'true'
        run: npx wrangler deploy
      - name: Point demo.assembly.rsvp at it
        if: steps.creds.outputs.ok == 'true'
        continue-on-error: true
        run: node scripts/demo-resources.mjs domain
      - name: Demo smoke check (a visitor gets a guest session, the map has events)
        if: steps.creds.outputs.ok == 'true'
        run: |
          sleep 15
          base=https://demo.assembly.rsvp
          curl -fsS -c jar "$base/api/config" | jq -c .gate
          curl -fsS -b jar "$base/api/me" | jq -e '.user.displayName' || echo "::warning::No guest session on the demo"

